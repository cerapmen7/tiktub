appId: com.cerapmen7.tiktub
productName: TikTub
copyright: Copyright © 2026 cerapmen7

directories:
  buildResources: build
  output: dist-installer

files:
  - package.json
  - dist-electron/**/*
  - backend/dist/**/*
  - backend/prisma/**/*
  - backend/package.json
  - backend/.env
  - .env
  - frontend/dist/**/*
  - shared/**/*
  - agents/**/*
  - assets/**/*
  - data/.gitkeep
  - data/downloads/.gitkeep
  # Ne pas empaqueter sources inutiles (mais garder agents/dist pour runtime)
  - "!**/*.ts"
  - "!**/*.map"
  - "!frontend/src/**/*"
  - "!backend/src/**/*"
  - "!electron/src/**/*"
  - "!dist-installer{,/**/*}"
  - "!dist{,/**/*}"
  - "!.git{,/**/*}"

extraResources:
  - from: data
    to: data
    filter:
      - "**/*"

asar: true
asarUnpack:
  - "backend/**/*"
  - "frontend/**/*"
  - "shared/**/*"
  - "agents/**/*"
  - "dist-electron/**/*"
  - "node_modules/**/*"

win:
  target:
    - nsis
    - portable
  icon: assets/icon.ico
  publisherName: cerapmen7
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TikTub
  uninstallDisplayName: TikTub
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeader: build/installerHeader.png
  installerSidebar: build/installerSidebar.png
  installerHeaderIcon: assets/icon.ico
  license: build/license.txt
  displayLanguageSelector: false
  language: 1036
  multiLanguageInstaller: false
  include: build/installer.nsh
  artifactName: TikTub-Setup-${version}.${ext}

portable:
  artifactName: TikTub-Portable-${version}.${ext}

linux:
  target: AppImage
  icon: assets/icon.png
  category: Video

mac:
  target: dmg
  icon: assets/icon.png
  category: public.app-category.video

publish: null
