<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TikTub — Chargement</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:100vw;height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background: radial-gradient(1200px 600px at 50% -10%, #7c3aed 0%, #4f46e5 25%, #0a0a0f 65%);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    color:white;
    overflow:hidden;
    user-select:none;
  }
  .logo{
    width:88px;height:88px;
    background: linear-gradient(135deg,#a78bfa,#7c3aed);
    border-radius:22px;
    display:flex;align-items:center;justify-content:center;
    font-size:44px;
    box-shadow: 0 20px 60px rgba(124,58,237,.45), inset 0 1px 0 rgba(255,255,255,.2);
    animation: float 2.2s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  h1{
    margin-top:20px;
    font-size:28px;font-weight:800;letter-spacing:-.02em;
    background: linear-gradient(90deg,#fff,#c4b5fd);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .sub{margin-top:6px;color:#c4b5fd;font-size:13px;letter-spacing:.02em;opacity:.9}
  .bar-wrap{
    margin-top:28px;
    width:220px;height:4px;
    background: rgba(255,255,255,.12);
    border-radius:999px;
    overflow:hidden;
    backdrop-filter: blur(8px);
  }
  .bar{
    height:100%;width:45%;
    background: linear-gradient(90deg,#a78bfa,#7c3aed,#f472b6);
    border-radius:999px;
    animation: load 1.1s ease-in-out infinite;
  }
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  .dots{margin-top:14px;font-size:12px;color:#a5b4fc;opacity:.85}
  .dots span{animation: blink 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
  .foot{position:fixed;bottom:16px;color:#6b7280;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="logo">🎬</div>
  <h1>TikTub</h1>
  <div class="sub">TikTok → YouTube • Automation IA</div>
  <div class="bar-wrap"><div class="bar"></div></div>
  <div class="dots">Démarrage du serveur<span>.</span><span>.</span><span>.</span></div>
  <div class="foot">v1.0.0 • cerapmen7</div>
</body>
</html>
